<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Detalhes do Evento</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons"
          rel="stylesheet">
</head>

<body>

    <nav class="blue darken-4">
        <div class="nav-wrapper container">
            <a href="/" class="brand-logo">Gestão de Eventos</a>
        </div>
    </nav>

    <div class="container" style="margin-top: 40px;">

        <div class="row">

            <div class="col s12 m8 offset-m2">

                <div class="card blue-grey darken-1">

                    <div class="card-content white-text">

                        <span class="card-title" th:text="${evento.nome}"></span>

                        <hr style="opacity: 0.3; margin: 15px 0;">

                        <p>
                            <i class="material-icons left">place</i>
                            <strong>Local:</strong>
                            <span th:text="${evento.local}"></span>
                        </p>

                        <p style="margin-top: 10px;">
                            <i class="material-icons left">event</i>
                            <strong>Data:</strong>
                            <span th:text="${evento.data}"></span>
                        </p>

                        <p style="margin-top: 10px;">
                            <i class="material-icons left">access_time</i>
                            <strong>Horário:</strong>
                            <span th:text="${evento.horario}"></span>
                        </p>

                    </div>

                    <div class="card-action">

                        <a href="/" class="btn white black-text waves-effect">
                            <i class="material-icons left">arrow_back</i>
                            Voltar à Home
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>

</body>

</html>
