<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">

    <title>Eventos</title>
</head>
<body>

<div th:replace="~{menu :: menu}"></div>

<div class="container">

    <h1>Lista de eventos</h1>

    <table class="highlight">
        <thead>
            <tr>
                <th>Id</th>
                <th>Nome</th>
                <th>Local</th>
                <th>Data</th>
                <th>Horário</th>
                <th>Ações</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="evento : ${eventos}">
                <td th:text="${evento.id}"></td>
                <td>
                    <a th:href="@{/eventos/{id}(id=${evento.id})}" th:text="${evento.nome}"></a>
                </td>
                <td th:text="${evento.local}"></td>
                <td th:text="${evento.data}"></td>
                <td th:text="${evento.horario}"></td>
                <td>
                    <a th:href="@{/eventos/{id}/selecionar(id=${evento.id})}">
                        <i class="material-icons orange-text">edit</i>
                    </a>
                    <a th:href="@{/eventos/{id}/remover(id=${evento.id})}">
                        <i class="material-icons red-text">delete</i>
                    </a>
                </td>
            </tr>
        </tbody>
    </table>

</div>

</body>
</html>
