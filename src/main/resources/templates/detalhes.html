<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">

    <title>Detalhes do Evento</title>
</head>

<body>

<div th:replace="~{menu :: menu}"></div>

<div class="container">

    <h1>Detalhes do evento</h1>

    <!-- MENSAGEM DE SUCESSO -->
    <div th:if="${mensagem}"
         class="card-panel green lighten-4 green-text text-darken-4">

        <span th:text="${mensagem}"></span>

    </div>

    <!-- DADOS DO EVENTO -->
    <div class="row">

        <div class="col s12">

            <div class="card blue-grey">

                <div class="card-content white-text">

                    <span class="card-title">Evento</span>

                    <b>Id:</b>
                    <span th:text="${evento.id}"></span>

                    <br>

                    <b>Nome:</b>
                    <span th:text="${evento.nome}"></span>

                    <br>

                    <b>Local:</b>
                    <span th:text="${evento.local}"></span>

                    <br>

                    <b>Data:</b>
                    <span th:text="${evento.data}"></span>

                    <br>

                    <b>Horário:</b>
                    <span th:text="${evento.horario}"></span>

                </div>

            </div>

        </div>

    </div>

    <!-- ADICIONAR CONVIDADO -->
    <div class="row">

        <div class="col s12">

            <div class="card">

                <div class="card-content">

                    <span class="card-title">
                        Adicionar Convidado:
                    </span>

                    <form method="post"
                          th:action="@{/eventos/{id}(id=${evento.id})}"
                          th:object="${convidado}">

                        <label>Nome:</label>

                        <input type="text"
                               th:field="*{nome}">

                        <p class="red-text"
                           th:if="${#fields.hasErrors('nome')}"
                           th:errors="*{nome}">
                        </p>

                        <label>RG:</label>

                        <input type="text"
                               th:field="*{rg}">

                        <p class="red-text"
                           th:if="${#fields.hasErrors('rg')}"
                           th:errors="*{rg}">
                        </p>

                        <button class="waves-effect waves-light btn"
                                type="submit">

                            Adicionar

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

    <!-- LISTA DE CONVIDADOS -->
    <div class="row">

        <div class="col s12">

            <div class="card">

                <div class="card-content">

                    <span class="card-title">
                        Convidados:
                    </span>

                    <table class="highlight">

                        <thead>

                            <tr>
                                <th>Nome</th>
                                <th>RG</th>
                                <th>Ações</th>
                            </tr>

                        </thead>

                        <tbody>

                            <tr th:each="convidado : ${convidados}">

                                <td th:text="${convidado.nome}"></td>

                                <td th:text="${convidado.rg}"></td>

                                <td>

                                    <a th:href="@{/eventos/{idEvento}/convidados/{idConvidado}/remover(
                                        idEvento=${evento.id},
                                        idConvidado=${convidado.id})}">

                                        <i class="material-icons blue-text">
                                            delete
                                        </i>

                                    </a>

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
